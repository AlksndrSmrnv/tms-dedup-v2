[project]
name = "tms-dedup-v2"
version = "0.1.0"
description = "Локальный инструмент поиска вероятных дублей тестов в TMS / Test IT по title и section path"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tms-dedup-v2 maintainers" }]

dependencies = [
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "numpy>=1.26",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
tms-dedup-build-dataset = "scripts.build_dataset:app"
tms-dedup-section-hypotheses = "scripts.infer_section_hypotheses:app"
tms-dedup-candidate-pairs = "scripts.generate_candidate_pairs:app"
tms-dedup-review-packs = "scripts.build_qwen_review_packs:app"
tms-dedup-merge-qwen = "scripts.merge_qwen_results:app"
tms-dedup-final-reports = "scripts.build_final_reports:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# Pydantic-модель TestItem — не тестовый класс; отключаем эвристику pytest,
# которая пытается коллектить всё, что начинается с "Test".
python_classes = "Test*Case"

[tool.ruff]
line-length = 100
target-version = "py311"
